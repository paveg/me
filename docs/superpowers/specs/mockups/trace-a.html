<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>トレース案A（使い捨てモック）</title>
<style>
:root {
  --paper: #FBFCFD; --ink: #1C2733; --muted: #5B6B7C; --rule: #DCE2E9;
  --span: #2E6BD6; --span-soft: #7090C2; --open: #B07200;
  --label-width: 22rem;
  --gutter: 5.5rem;
}
@media (prefers-color-scheme: dark) {
  :root { --paper: #14212F; --ink: #E6ECF2; --muted: #9AABBD; --rule: #2A3B4F; --span: #6FA0F2; --span-soft: #5A7AAE; --open: #F2B544; }
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--paper); color: var(--ink); font-family: 'LINE Seed JP', system-ui, sans-serif; line-height: 1.75; }
main { max-width: 72rem; margin: 0 auto; padding: 3rem 1.5rem; }
.hint { color: var(--muted); font-size: 0.875rem; margin: 0 0 1rem; }

.trace { position: relative; }
.axis, summary { display: grid; grid-template-columns: var(--label-width) 1fr; }
.axis { height: 2rem; border-bottom: 1px solid var(--rule); }
.track { position: relative; margin-right: var(--gutter); background: repeating-linear-gradient(to right, var(--rule) 0 1px, transparent 1px calc(100% / 6)); }
.track::after { content: ''; position: absolute; top: 0; bottom: 0; left: var(--now); border-left: 1px dashed var(--muted); }
.axis .tick { position: absolute; top: 0.25rem; font-size: 0.8125rem; color: var(--muted); padding-left: 0.375rem; }
.axis .now-label { position: absolute; top: 0.25rem; font-size: 0.8125rem; color: var(--ink); transform: translateX(-100%); padding-right: 0.375rem; white-space: nowrap; }

details { border-bottom: 1px solid var(--rule); position: relative; }
details.child { border-bottom: 0; }
details.child:has(+ details:not(.child)) { border-bottom: 1px solid var(--rule); }
summary { list-style: none; cursor: pointer; min-height: 3.25rem; }
summary::-webkit-details-marker { display: none; }
summary:hover { background: color-mix(in srgb, var(--rule) 35%, transparent); }
summary:focus-visible { outline: 2px solid var(--span); outline-offset: -2px; }

.label { display: grid; grid-template-columns: 1rem 1fr auto; gap: 0 0.5rem; padding: 0.5rem 1rem 0.5rem 0; align-items: baseline; }
.child .label { padding-left: 1.25rem; }
.caret { width: 0.75rem; height: 0.75rem; transition: transform 200ms; }
details[open] .caret { transform: rotate(90deg); }
.role { white-space: nowrap; }
.parent .role, .other .role { font-weight: 700; }
.period { font-size: 0.8125rem; color: var(--muted); white-space: nowrap; text-align: right; }
.label small { grid-column: 2 / -1; font-size: 0.8125rem; color: var(--muted); }
.child::before { content: ''; position: absolute; left: 0.375rem; top: 0; bottom: 0; border-left: 1px solid var(--rule); }

.bar { position: absolute; top: 50%; transform-origin: left center; border-radius: 2px; background: var(--span); }
.parent .bar { height: 14px; margin-top: -7px; }
.child .bar { height: 6px; margin-top: -3px; }
.other .bar { height: 14px; margin-top: -7px; background: var(--span-soft); }
.open-end { position: absolute; top: 50%; width: 9px; height: 9px; margin: -4.5px 0 0 -4.5px; border-radius: 50%; background: var(--open); }
.duration { position: absolute; z-index: 1; top: 50%; transform: translateY(-50%); margin-left: 0.5rem; padding: 0 0.25rem; background: var(--paper); font-size: 0.8125rem; color: var(--muted); white-space: nowrap; line-height: 1.4; }
summary:hover .duration { background: color-mix(in srgb, var(--rule) 35%, var(--paper)); }

.playhead { position: absolute; top: 0; bottom: 0; left: var(--label-width); width: 0; border-left: 2px solid var(--span); pointer-events: none; opacity: 0; }

.detail { padding: 0.25rem 0 1.5rem var(--label-width); color: var(--ink); }
.detail p { margin: 0 0 0.5rem; max-width: 40rem; }

@media (max-width: 40rem) {
  :root { --label-width: 0px; }
  summary { grid-template-columns: 1fr; }
  .track { height: 1.75rem; }
  .axis .tick:nth-child(even) { display: none; }
  :root { --gutter: 4.5rem; }
  .track { background: repeating-linear-gradient(to right, var(--rule) 0 1px, transparent 1px calc(100% / 3)); }
}
@media print {
  .playhead { display: none; }
  .track { background: none; }
}
</style>
</head>
<body>
<main>
  <p class="hint">各行を開くと、役割の詳細と使った技術が見られます。</p>
  <section class="trace" aria-label="経歴">
    <div class="axis" aria-hidden="true"><span></span><span class="track" id="axis"></span></div>
    <div id="rows"></div>
    <div class="playhead" id="playhead" aria-hidden="true"></div>
  </section>
</main>
<svg width="0" height="0" style="position:absolute"><symbol id="i-caret" viewBox="0 0 12 12"><path d="M4 2l4 4-4 4" fill="none" stroke="currentColor" stroke-width="1.5"/></symbol></svg>

<script>
const AXIS_START = 2015, AXIS_END = 2027, NOW = '2026-11';
const months = (ym) => { const [y, m] = ym.split('-').map(Number); return y * 12 + (m - 1); };
const pct = (monthIndex) => ((monthIndex / 12 - AXIS_START) / (AXIS_END - AXIS_START)) * 100;
const startPct = (ym) => pct(months(ym));
const endPct = (ym) => pct(months(ym) + 1);
const NOW_PCT = endPct(NOW);
const fmt = (ym) => (ym ? ym.replace('-', '.') : '現在');
const duration = (start, end) => {
  const n = months(end ?? NOW) - months(start) + 1;
  const y = Math.floor(n / 12), m = n % 12;
  return [y ? `${y}y` : '', m ? `${m}m` : ''].filter(Boolean).join(' ');
};

const rows = [
  { kind: 'other', label: 'エクストップテクノロジー', sub: 'オンプレからAWSへの移行', start: '2015-04', end: '2015-10' },
  { kind: 'parent', label: 'freee', sub: 'クラウド会計・人事労務SaaS', start: '2015-11', end: null },
  { kind: 'child', label: 'Software Engineer', sub: '銀行・カード会社とのAPI連携', start: '2015-11', end: '2019-06' },
  { kind: 'child', label: 'Tech Lead', sub: '融資サービスの立ち上げ', start: '2019-07', end: '2022-06' },
  { kind: 'child', label: 'Tech Lead', sub: '紙の証憑を仕訳データにする', start: '2022-07', end: '2023-03' },
  { kind: 'child', label: 'EM / Tech Lead', sub: '税理士向けサービスの作り直し', start: '2023-04', end: '2024-06' },
  { kind: 'child', label: 'EM / Tech Lead', sub: '従業員向けアプリの立ち上げ', start: '2024-07', end: '2024-12' },
  { kind: 'child', label: 'Architect', sub: '人事労務基盤のサービス分割', start: '2025-01', end: '2026-05' },
  { kind: 'child', label: 'SRE / Tech Lead', sub: '開発基盤とプラットフォーム', start: '2026-06', end: null },
  { kind: 'other', label: 'ACALL', sub: '業務委託でRailsの更新', start: '2018-08', end: '2019-04' },
];

const ticks = Array.from({ length: 6 }, (_, i) => AXIS_START + i * 2);
document.getElementById('axis').innerHTML =
  ticks.map((y) => `<span class="tick" style="left:${startPct(`${y}-01`)}%">${y}</span>`).join('') +
  `<span class="now-label" style="left:${NOW_PCT}%">現在</span>`;
document.querySelector('.trace').style.setProperty('--now', `${NOW_PCT}%`);

document.getElementById('rows').innerHTML = rows.map((r) => {
  const left = startPct(r.start), right = r.end ? endPct(r.end) : NOW_PCT, width = right - left;
  return `<details class="${r.kind}">
    <summary>
      <span class="label"><svg class="caret" aria-hidden="true"><use href="#i-caret"/></svg><span class="role">${r.label}</span><span class="period">${fmt(r.start)} – ${fmt(r.end)}</span><small>${r.sub}</small></span>
      <span class="track">
        <span class="bar" style="left:${left}%;width:${width}%"></span>
        ${r.end ? '' : `<span class="open-end" style="left:${right}%"></span>`}
        <span class="duration" style="left:${right}%">${duration(r.start, r.end)}</span>
      </span>
    </summary>
    <div class="detail"><p>（ここに役割の説明・STAR・技術タグが入る）</p></div>
  </details>`;
}).join('');
</script>

<script type="module">
import { animate } from 'https://cdn.jsdelivr.net/npm/animejs@4.5.0/+esm';

if (!matchMedia('(prefers-reduced-motion: reduce)').matches) {
  const trace = document.querySelector('.trace');
  const playhead = document.getElementById('playhead');
  const spans = [...trace.querySelectorAll('details')].map((d) => {
    const bar = d.querySelector('.bar');
    const left = parseFloat(bar.style.left), width = parseFloat(bar.style.width);
    return { bar, left, width, dur: d.querySelector('.duration'), end: d.querySelector('.open-end') };
  });
  const track = trace.querySelector('#axis');
  const fade = (el, on) => { if (el) el.style.opacity = on ? '1' : '0'; };

  const render = (cursor) => {
    playhead.style.transform = `translateX(${(cursor / 100) * track.clientWidth}px)`;
    for (const s of spans) {
      const t = Math.min(Math.max((cursor - s.left) / s.width, 0), 1);
      s.bar.style.transform = `scaleX(${t})`;
      fade(s.dur, t >= 1);
      fade(s.end, t >= 1);
    }
  };
  render(0);
  for (const s of spans) { if (s.dur) s.dur.style.transition = 'opacity 300ms'; }

  const state = { cursor: 0 };
  playhead.style.opacity = '1';
  animate(state, {
    cursor: parseFloat(trace.style.getPropertyValue('--now')),
    duration: 2600,
    delay: 300,
    ease: 'inOutSine',
    onUpdate: () => render(state.cursor),
    onComplete: () => {
      for (const s of spans) {
        s.bar.style.transform = '';
        fade(s.dur, true);
        fade(s.end, true);
      }
      animate(playhead, { opacity: 0, duration: 400, ease: 'outQuad' });
    },
  });
}
</script>
</body>
</html>
