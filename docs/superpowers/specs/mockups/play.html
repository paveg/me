<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Podを詰める — play mockup</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+JP:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root {
  --paper: #FBFCFD;
  --ink: #1C2733;
  --muted: #5B6B7C;
  --rule: #DCE2E9;
  --span: #2E6BD6;
  --span-soft: #7090C2;
  --open: #B07200;
  --unit: 1.375rem;
}
@media (prefers-color-scheme: dark) {
  :root {
    --paper: #14212F;
    --ink: #E6ECF2;
    --muted: #9AABBD;
    --rule: #2A3B4F;
    --span: #6FA0F2;
    --span-soft: #5A7AAE;
    --open: #F2B544;
  }
}
* { box-sizing: border-box; }
body {
  margin: 0; background: var(--paper); color: var(--ink);
  font-family: 'IBM Plex Sans JP', system-ui, sans-serif; line-height: 1.75;
  font-variant-numeric: tabular-nums;
}
a { color: var(--span); text-underline-offset: 0.2em; }
button:focus-visible, a:focus-visible { outline: 2px solid var(--span); outline-offset: 3px; }
.page { max-width: 72rem; margin: 0 auto; padding: 3rem 1.5rem 5rem; }
.back { font-size: 0.875rem; }
h1 { font-size: clamp(2rem, 5vw, 3rem); font-weight: 600; letter-spacing: -0.03em; line-height: 1.15; margin: 2.5rem 0 0.75rem; }
.lead { max-width: 42rem; margin: 0; color: var(--muted); }
.lead span { display: inline-block; }

.controls { display: flex; flex-wrap: wrap; gap: 0.75rem; margin: 2rem 0 1.5rem; }
.controls button {
  font: inherit; font-weight: 500; min-height: 44px; padding: 0 1.125rem; border-radius: 999px; cursor: pointer;
  border: 1px solid var(--rule); background: transparent; color: var(--ink);
}
.controls button.primary { background: var(--ink); color: var(--paper); border-color: var(--ink); }
.controls button:hover { border-color: var(--span); }

.stats { display: flex; flex-wrap: wrap; gap: 0.5rem 2.5rem; margin: 0 0 1.5rem; }
.stats div { display: flex; flex-direction: column; }
.stats dt { font-size: 0.8125rem; color: var(--muted); }
.stats dd { margin: 0; font-size: 1.75rem; font-weight: 600; letter-spacing: -0.02em; line-height: 1.2; }
.stats dd small { font-size: 0.9375rem; font-weight: 500; color: var(--muted); margin-left: 0.125rem; }

.stage { display: grid; grid-template-columns: 1fr 17rem; gap: 2.5rem; align-items: start; }

.pending {
  display: flex; flex-wrap: wrap; align-items: flex-end; gap: 0.375rem;
  min-height: calc(var(--unit) * 4 + 2rem); padding: 0 0 0.75rem;
  border-bottom: 1px dashed var(--rule);
}
.lane-label { width: 100%; font-size: 0.8125rem; color: var(--muted); }

.cluster { display: flex; flex-wrap: wrap; gap: 1.25rem; padding-top: 1.5rem; min-height: calc(var(--unit) * 8 + 4rem); }
.node { width: 5.75rem; display: flex; flex-direction: column; transform-origin: bottom center; }
.node-head { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: baseline; column-gap: 0.25rem; font-size: 0.8125rem; color: var(--muted); }
.node-head .name { color: var(--ink); font-weight: 500; white-space: nowrap; }
.meter { height: 3px; background: var(--rule); border-radius: 2px; margin: 0.25rem 0 0.375rem; overflow: hidden; }
.meter i { display: block; height: 100%; background: var(--span); transform-origin: left; transform: scaleX(0); }
.node-body {
  position: relative; height: calc(var(--unit) * 8 + 0.5rem); padding: 0.25rem;
  border: 1px solid var(--rule); border-radius: 6px;
  display: flex; flex-direction: column-reverse;
  background-image: repeating-linear-gradient(to top, transparent 0 calc(var(--unit) - 1px), color-mix(in srgb, var(--rule) 70%, transparent) calc(var(--unit) - 1px) var(--unit));
  background-origin: content-box; background-clip: content-box;
  transition: border-color 200ms ease;
}
.node-outline { position: absolute; inset: -1px; width: calc(100% + 2px); height: calc(100% + 2px); pointer-events: none; overflow: visible; }
.node-outline rect { fill: none; stroke: var(--span); stroke-width: 1.5; }
.node.provisioning .node-body { border-color: transparent; }
.node:not(.provisioning) .node-outline { display: none; }
.node.ready-flash .node-body { border-color: var(--span); }
.node.draining .node-body {
  border-color: var(--open);
  background-image: repeating-linear-gradient(135deg, transparent 0 7px, color-mix(in srgb, var(--open) 14%, transparent) 7px 14px);
}
.node.draining .node-head .state { color: var(--open); }

.pod {
  height: calc(var(--unit) * var(--size)); width: 100%;
  border: 2px solid var(--paper); border-radius: 5px;
  background: var(--span); color: var(--paper);
  font: inherit; font-size: 0.75rem; font-weight: 600; line-height: 1; display: grid; place-items: center;
  cursor: pointer; flex: none; position: relative; z-index: 1;
  transition: box-shadow 200ms ease;
}
.pod[data-size="1"] { background: var(--span-soft); }
.pod[data-size="4"] { background: var(--ink); }
.pending .pod { width: 4.75rem; }
.pod.lifted { box-shadow: 0 10px 18px -8px color-mix(in srgb, var(--ink) 55%, transparent); z-index: 2; }

.log-title { font-size: 0.8125rem; color: var(--muted); margin: 0 0 0.5rem; }
.log { list-style: none; margin: 0; padding: 0; border-top: 1px solid var(--rule); font-size: 0.875rem; }
.log li { display: grid; grid-template-columns: 3.25rem 1fr; gap: 0.5rem; padding: 0.5rem 0; border-bottom: 1px solid var(--rule); }
.log time { color: var(--muted); }
.log .kind-scale { color: var(--span); }
.log .kind-consolidate { color: var(--open); }

.note { margin-top: 3rem; max-width: 42rem; font-size: 0.875rem; color: var(--muted); }
@media (max-width: 52rem) {
  .stage { grid-template-columns: 1fr; }
}
@media (max-width: 40rem) {
  :root { --unit: 1.125rem; }
  .node { width: 4.25rem; }
  .cluster { gap: 0.75rem; }
}
</style>
</head>
<body>
<main class="page">
  <a class="back" href="mockup.html">トップに戻る</a>
  <h1>Podを詰める</h1>
  <p class="lead"><span>Podを追加すると、</span><span>空きのあるノードに詰め込まれます。</span><span>入りきらなければノードが増え、</span><span>Podを消すと、</span><span>空けられるノードは統合されて消えます。</span></p>

  <div class="controls">
    <button class="primary" data-add>Podを追加</button>
    <button data-burst>まとめて6個</button>
    <button data-remove>ランダムに1個消す</button>
  </div>

  <dl class="stats">
    <div><dt>ノード</dt><dd><span id="stat-nodes">0</span><small>台</small></dd></div>
    <div><dt>使用率</dt><dd><span id="stat-rate">0</span><small>%</small></dd></div>
    <div><dt>統合で減らしたノード</dt><dd><span id="stat-saved">0</span><small>台</small></dd></div>
  </dl>

  <div class="stage">
    <div>
      <section class="pending" id="pending" aria-label="待機中のPod"><span class="lane-label">待機中</span></section>
      <section class="cluster" id="cluster" aria-label="ノード"></section>
    </div>
    <section aria-labelledby="log-title">
      <h2 class="log-title" id="log-title">イベント</h2>
      <ol class="log" id="log" aria-live="polite"></ol>
    </section>
  </div>

  <p class="note">Podをクリックすると消せます。ノードの容量は8、Podの大きさは1・2・4のどれかです。本物のKarpenterはコストやインスタンスの種類も見て判断しますが、ここでは「入るところに詰め、空けられるノードは空ける」だけを再現しています。</p>
</main>

<script type="module">
import { animate, svg, stagger } from 'https://cdn.jsdelivr.net/npm/animejs@4.5.0/+esm';

const CAPACITY = 8, MAX_NODES = 6;
const reduceMotion = matchMedia('(prefers-reduced-motion: reduce)').matches;
const ms = (value) => (reduceMotion ? 0 : value);
const sleep = (value) => new Promise((resolve) => setTimeout(resolve, ms(value)));
const pick = (items) => items[Math.floor(Math.random() * items.length)];

const pendingEl = document.getElementById('pending');
const clusterEl = document.getElementById('cluster');
const logEl = document.getElementById('log');
const startedAt = performance.now();

let podSeq = 0, nodeSeq = 0, savedNodes = 0, shownRate = 0, rateAnimation = null;
const nodes = [];

let queue = Promise.resolve();
const enqueue = (task) => { queue = queue.then(task).catch((error) => console.error(error)); return queue; };

const used = (node) => node.pods.reduce((sum, pod) => sum + pod.size, 0);
const free = (node) => CAPACITY - used(node);

function log(text, kind = '') {
  const item = document.createElement('li');
  const seconds = ((performance.now() - startedAt) / 1000).toFixed(1);
  item.innerHTML = `<time>+${seconds}s</time><span class="${kind ? `kind-${kind}` : ''}">${text}</span>`;
  logEl.prepend(item);
  while (logEl.children.length > 8) logEl.lastElementChild.remove();
  animate(item, { opacity: [0, 1], x: [12, 0], duration: ms(300), ease: 'outQuad' });
}

function refreshStats() {
  const ready = nodes.filter((node) => !node.provisioning);
  const capacity = ready.length * CAPACITY;
  const total = ready.reduce((sum, node) => sum + used(node), 0);
  const rate = capacity ? Math.round((total / capacity) * 100) : 0;
  document.getElementById('stat-nodes').textContent = nodes.length;
  document.getElementById('stat-saved').textContent = savedNodes;
  rateAnimation?.pause();
  document.getElementById('stat-rate').textContent = shownRate;
  const counter = { value: shownRate };
  rateAnimation = animate(counter, {
    value: rate, duration: ms(500), ease: 'outQuad',
    onUpdate: () => { document.getElementById('stat-rate').textContent = Math.round(counter.value); },
    onComplete: () => { document.getElementById('stat-rate').textContent = rate; },
  });
  shownRate = rate;
  for (const node of nodes) {
    node.el.querySelector('.state').textContent = node.draining ? '統合中' : node.provisioning ? '起動中' : `${used(node)}/${CAPACITY}`;
    animate(node.el.querySelector('.meter i'), { scaleX: used(node) / CAPACITY, duration: ms(400), ease: 'outQuad' });
  }
}

async function fly(podEl, targetParent, { arc = 48, duration = 620 } = {}) {
  const first = podEl.getBoundingClientRect();
  targetParent.append(podEl);
  const last = podEl.getBoundingClientRect();
  const dx = first.left - last.left, dy = first.top - last.top;
  podEl.classList.add('lifted');
  const progress = { t: 0 };
  podEl.style.transform = `translate(${dx}px, ${dy}px)`;
  animate(progress, {
    t: 1, duration: ms(duration), ease: 'inOutCubic',
    onUpdate: () => {
      const t = progress.t;
      podEl.style.transform = `translate(${dx * (1 - t)}px, ${dy * (1 - t) - arc * 4 * t * (1 - t)}px)`;
    },
  });
  await sleep(duration);
  podEl.style.transform = '';
  podEl.classList.remove('lifted');
  animate(podEl, { scaleY: [0.78, 1], scaleX: [1.1, 1], duration: ms(500), ease: 'outElastic(1, .5)' });
}

async function provisionNode() {
  const el = document.createElement('div');
  el.className = 'node provisioning';
  el.innerHTML = `
    <div class="node-head"><span class="name">ノード${++nodeSeq}</span><span class="state"></span></div>
    <div class="meter"><i></i></div>
    <div class="node-body"><svg class="node-outline" aria-hidden="true"><rect x="0.75" y="0.75" rx="6" width="calc(100% - 1.5px)" height="calc(100% - 1.5px)"/></svg></div>`;
  clusterEl.append(el);
  const node = { id: nodeSeq, el, body: el.querySelector('.node-body'), pods: [], provisioning: true, draining: false };
  nodes.push(node);
  refreshStats();
  log(`ノード${node.id}を起動します`, 'scale');
  animate(el, { opacity: [0, 1], y: [16, 0], duration: ms(300), ease: 'outQuad' });
  const rect = el.querySelector('rect');
  const { width, height } = node.body.getBoundingClientRect();
  rect.setAttribute('width', width - 1.5);
  rect.setAttribute('height', height - 1.5);
  animate(svg.createDrawable(rect), { draw: ['0 0', '0 1'], duration: ms(800), ease: 'inOutQuad' });
  await sleep(850);
  node.provisioning = false;
  el.classList.remove('provisioning');
  el.classList.add('ready-flash');
  setTimeout(() => el.classList.remove('ready-flash'), ms(450));
  refreshStats();
  return node;
}

async function placePod(pod) {
  let node = nodes.filter((n) => !n.draining && free(n) >= pod.size).sort((a, b) => free(a) - free(b))[0];
  if (!node) {
    if (nodes.length >= MAX_NODES) { log(`ノードの上限に達したため、Pod(${pod.size})は待機中のままです`); return; }
    node = await provisionNode();
  }
  node.pods.push(pod);
  pod.node = node;
  await fly(pod.el, node.body, { arc: 36, duration: 520 });
  log(`Pod(${pod.size})をノード${node.id}に配置しました`);
  refreshStats();
}

async function addPod(size = pick([1, 1, 2, 2, 2, 4])) {
  const el = document.createElement('button');
  el.className = 'pod';
  el.dataset.size = size;
  el.style.setProperty('--size', size);
  el.setAttribute('aria-label', `大きさ${size}のPodを消す`);
  el.textContent = size;
  const pod = { id: ++podSeq, size, el, node: null };
  el.addEventListener('click', () => requestRemove(pod));
  pendingEl.append(el);
  animate(el, { y: [-36, 0], opacity: [0, 1], duration: ms(320), ease: 'outQuad' });
  await sleep(200);
  await placePod(pod);
}

async function removePod(pod) {
  if (!pod.node || pod.node.draining) return;
  const node = pod.node;
  node.pods = node.pods.filter((p) => p !== pod);
  pod.node = null;
  animate(pod.el, { scale: [1, 0.2], opacity: [1, 0], duration: ms(240), ease: 'inQuad' });
  await sleep(240);
  pod.el.remove();
  log(`Pod(${pod.size})をノード${node.id}から削除しました`);
  refreshStats();
}

async function slideNodes(mutate) {
  const before = new Map(nodes.map((node) => [node, node.el.getBoundingClientRect()]));
  mutate();
  for (const node of nodes) {
    const first = before.get(node), last = node.el.getBoundingClientRect();
    if (!first) continue;
    animate(node.el, { x: [first.left - last.left, 0], y: [first.top - last.top, 0], duration: ms(500), ease: 'outCubic' });
  }
}

async function terminate(node) {
  animate(node.el, { scaleY: [1, 0], opacity: [1, 0], duration: ms(380), ease: 'inBack(1.4)' });
  await sleep(380);
  await slideNodes(() => { nodes.splice(nodes.indexOf(node), 1); node.el.remove(); });
}

async function consolidate() {
  for (const empty of nodes.filter((n) => !n.provisioning && n.pods.length === 0)) {
    log(`空になったノード${empty.id}を削除しました`, 'consolidate');
    savedNodes++;
    await terminate(empty);
    refreshStats();
  }
  const ready = nodes.filter((n) => !n.provisioning);
  if (ready.length < 2) return;
  const victim = [...ready].sort((a, b) => used(a) - used(b))[0];
  const others = ready.filter((n) => n !== victim);
  const room = new Map(others.map((n) => [n, free(n)]));
  const plan = [];
  for (const pod of [...victim.pods].sort((a, b) => b.size - a.size)) {
    const target = others.filter((n) => room.get(n) >= pod.size).sort((a, b) => room.get(a) - room.get(b))[0];
    if (!target) return;
    room.set(target, room.get(target) - pod.size);
    plan.push([pod, target]);
  }

  victim.draining = true;
  victim.el.classList.add('draining');
  refreshStats();
  log(`ノード${victim.id}のPodはほかのノードに収まるため、統合します`, 'consolidate');
  animate(victim.el, { scale: [1, 1.04, 1], duration: ms(500), ease: 'inOutQuad' });
  await sleep(550);

  for (const [pod] of plan) pod.el.classList.add('lifted');
  animate(plan.map(([pod]) => pod.el), { y: [0, -8], duration: ms(250), delay: stagger(60), ease: 'outQuad' });
  await sleep(350);

  for (const [pod, target] of plan) {
    victim.pods = victim.pods.filter((p) => p !== pod);
    target.pods.push(pod);
    pod.node = target;
    pod.el.style.transform = '';
    fly(pod.el, target.body, { arc: 70, duration: 680 });
    await sleep(140);
    refreshStats();
  }
  await sleep(600);

  log(`ノード${victim.id}を削除しました（Pod${plan.length}個を移動）`, 'consolidate');
  savedNodes++;
  await terminate(victim);
  refreshStats();
  await sleep(300);
  await consolidate();
}

let consolidateTimer;
function requestRemove(pod) {
  enqueue(() => removePod(pod));
  clearTimeout(consolidateTimer);
  consolidateTimer = setTimeout(() => enqueue(consolidate), ms(900));
}

document.querySelector('[data-add]').addEventListener('click', () => enqueue(() => addPod()));
document.querySelector('[data-burst]').addEventListener('click', () => { for (let i = 0; i < 6; i++) enqueue(() => addPod()); });
document.querySelector('[data-remove]').addEventListener('click', () => {
  const placed = nodes.flatMap((n) => (n.provisioning || n.draining ? [] : n.pods));
  if (placed.length) requestRemove(pick(placed));
});

const intro = [4, 4, 2, 2, 1, 4, 1];
for (const size of intro) enqueue(() => addPod(size));
enqueue(async () => {
  await sleep(500);
  const removable = nodes[1]?.pods.find((p) => p.size === 2);
  if (removable) await removePod(removable);
  await sleep(400);
  await consolidate();
});
refreshStats();
</script>
</body>
</html>
